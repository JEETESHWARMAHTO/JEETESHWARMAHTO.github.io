<section class="mt-10 flex justify-center sm:mt-16" aria-label="Create account">
  <div class="glass w-full max-w-md rounded-2xl p-5 sm:p-7">
    <div class="flex flex-col items-center text-center">
      <svg class="h-12 w-12" aria-hidden="true"><use href="#logo-mark"></use></svg>
      <h1 class="font-display mt-4 text-xl font-bold">Create your account</h1>
      <p class="mt-1 text-sm text-ink-dim">Your contacts stay separate and yours</p>
    </div>

    <form id="auth-form" class="mt-6 space-y-4" data-mode="signup" novalidate>
      <div>
        <label class="label" for="auth-email">Email</label>
        <input id="auth-email" class="input" type="email" name="email" autocomplete="email" placeholder="you@example.com" required />
      </div>
      <div>
        <label class="label" for="auth-password">Password</label>
        <input id="auth-password" class="input" type="password" name="password" autocomplete="new-password" placeholder="At least 8 characters" minlength="8" required />
      </div>
      <div>
        <label class="label" for="auth-confirm">Confirm password</label>
        <input id="auth-confirm" class="input" type="password" name="confirm" autocomplete="new-password" placeholder="Repeat your password" minlength="8" required />
      </div>
      <p id="auth-error" class="hidden rounded-lg border border-danger/40 bg-danger/10 px-3 py-2 text-[13px] text-danger" role="alert"></p>
      <button id="auth-submit" class="btn btn-primary w-full justify-center py-2.5" type="submit">Create account</button>
    </form>

    <p class="mt-5 text-center text-sm text-ink-dim">
      Already have an account? <a href="/login" class="text-btn">Sign in</a>
    </p>
    <p class="mt-2 text-center text-[13px] text-ink-dim">
      <a href="/welcome" class="text-btn">Back to welcome</a>
    </p>
  </div>
</section>
